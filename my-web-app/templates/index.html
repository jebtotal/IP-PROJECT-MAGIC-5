<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="ERP MAGIC-5 web application">
    <title>ERP MAGIC-5</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main>
      <p>ERP MAGIC-5</p>
      {% if profile %}
        <h1>Welcome, {{ profile.full_name or profile.email }}.</h1>
        <p>You are signed in to your workspace.</p>
        <form action="{{ url_for('logout') }}" method="post">
          <button type="submit">Log out</button>
        </form>
      {% else %}
        <h1>Your workspace starts here.</h1>
        <p>
          Sign in to your workspace, or create an account to request access.
        </p>
        <a class="button" href="{{ url_for('login') }}">Log in</a>
        <a class="button" href="{{ url_for('register') }}">Register</a>
      {% endif %}
    </main>
  </body>
</html>
