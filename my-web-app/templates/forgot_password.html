{% extends "base.html" %}
{% block title %}Reset password | PentadERP{% endblock %}
{% block head_scripts %}
  <script src="{{ url_for('static', filename='forgot-password.js') }}" defer></script>
{% endblock %}

{% block guest_content %}
  <main class="auth-page">
    <section class="auth-card glass-panel">
      <a class="auth-back" href="{{ url_for('login') }}">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to log in
      </a>
      <div class="auth-brand">
        <img src="{{ url_for('static', filename='erp-logo.png') }}" alt="" class="brand-logo">
        <span>PentadERP</span>
      </div>
      <h1 class="auth-heading">Reset your password</h1>
      <p class="auth-description">Enter your email and we’ll send you a password reset link.</p>
      <form id="forgot-password-form" class="auth-form">
        <label class="field" for="email">
          <span class="field-label">Email</span>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </label>
        <button type="submit" class="btn btn-primary auth-submit">Send reset link</button>
        <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>
{% endblock %}
