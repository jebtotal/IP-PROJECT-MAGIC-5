<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Register for ERP MAGIC-5">
    <title>Register | ERP MAGIC-5</title>
    <script src="{{ url_for('static', filename='register.js') }}" defer></script>
  </head>
  <body>
    <main>
      <p>ERP MAGIC-5</p>
      <h1>Create an account</h1>
      <p>
        Your account will be pending until an administrator approves your access.
      </p>
      <form id="register-form">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" autocomplete="name" maxlength="120" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
        <p>Use at least 8 characters.</p>

        <button>Register</button>
        <p id="form-message" role="status" aria-live="polite"></p>
      </form>
      <p><a href="{{ url_for('index') }}">Back to home</a></p>
    </main>
  </body>
</html>
