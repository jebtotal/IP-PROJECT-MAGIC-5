{% extends "base.html" %}

{% block title %}Service temporarily unavailable | PentadERP{% endblock %}

{% block guest_content %}

    <section class="glass-panel max-w-xl p-8 text-center">
      <h1 class="text-2xl font-semibold">Service temporarily unavailable</h1>
      <p class="mt-4">The application could not reach Supabase in time. Please wait a moment and try again.</p>
      <a class="btn btn-primary mt-6 inline-flex" href="{{ request.path }}">Try again</a>
    </section>
  </main>
{% endblock %}
