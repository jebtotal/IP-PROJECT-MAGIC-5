<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set password | ERP MAGIC-5</title>
    <script src="{{ url_for('static', filename='set-password.js') }}" defer></script>
  </head>
  <body>
    <main>
      <p>ERP MAGIC-5</p>
      <h1>Set your password</h1>
      <p>Choose a new password before continuing.</p>
      <form id="set-password-form">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
        <label for="confirmation">Confirm password</label>
        <input id="confirmation" name="confirmation" type="password" minlength="8" autocomplete="new-password" required>
        <button type="submit">Set password</button>
        <p id="form-message" role="alert" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
