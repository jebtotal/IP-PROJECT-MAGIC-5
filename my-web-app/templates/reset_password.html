{% extends "base.html" %}
{% block title %}Choose a new password | ERP MAGIC-5{% endblock %}
{% block head_scripts %}
  <script src="{{ url_for('static', filename='reset-password.js') }}" defer></script>
{% endblock %}

{% block guest_content %}
  <main class="auth-page">
    <section class="auth-card glass-panel">
      <a class="auth-back" href="{{ url_for('login') }}">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to log in
      </a>
      <div class="auth-brand">
        <img src="{{ url_for('static', filename='erp-logo.png') }}" alt="" class="brand-logo">
        <span>ERP MAGIC-5</span>
      </div>
      <h1 class="auth-heading">Choose a new password</h1>
      <p class="auth-description">Use the reset link sent to your email to set a new password.</p>
      <form id="reset-password-form" class="auth-form">
        <input type="hidden" name="token" value="{{ token }}">
        <label class="field" for="password">
          <span class="field-label">New password</span>
          <span class="input-with-toggle">
            <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </span>
        </label>
        <label class="field" for="confirmation">
          <span class="field-label">Confirm password</span>
          <span class="input-with-toggle">
            <input id="confirmation" name="confirmation" type="password" minlength="8" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-password-toggle="confirmation" aria-label="Show password">
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </span>
        </label>
        <button type="submit" class="btn btn-primary auth-submit">Reset password</button>
        <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>
{% endblock %}
