<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new password | ERP MAGIC-5</title>
    <script src="{{ url_for('static', filename='reset-password.js') }}" defer></script>
  </head>
  <body>
    <main>
      <p>ERP MAGIC-5</p>
      <h1>Choose a new password</h1>
      <form id="reset-password-form">
        <input type="hidden" name="token" value="{{ token }}">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
        <label for="confirmation">Confirm password</label>
        <input id="confirmation" name="confirmation" type="password" minlength="8" autocomplete="new-password" required>
        <button type="submit">Reset password</button>
        <p id="form-message" role="alert" aria-live="polite"></p>
      </form>
      <p><a href="{{ url_for('login') }}">Back to log in</a></p>
    </main>
  </body>
</html>
