<!doctype html><html lang="en" dir="ltr" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>S—PentatERP Sale Form</title><link rel="stylesheet" href="https://cdn.tailwindcss.com"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="/docs/ui-ux/mockups/shared/theme.css"/><link rel="stylesheet" href="/docs/ui-ux/mockups/shared/tailwind-config.css"/></head><body class="p-6 sm:p-8 bg-gray-50 dark:bg-slate-950"><header class="border-b border-gray-200 dark:border-slate-800/50 bg-white dark:bg-slate-900"><div class="max-w-7xl mx-auto flex items-center justify-between h-20 px-6"><div class="flex items-center gap-3"><h1 class="text-lg font-bold uppercase tracking-wider">PentadERP / CREATE SALE</h1></div><div class="flex items-center gap-3"><button class="rounded-full p-2 hover:bg-gray-100 dark:hover:bg-slate-800/30 transition-colors" aria-label="Toggle"/><i class="fa-moon text-slate-400 dark-block"></i><i class="fa-sun text-slate-400 hidden dark-block"></i></button><span class="text-sm font-medium text-slate-600 dark:text-slate-300">Admin</span></div></div></header><main><div class="max-w-2xl mx-auto p-6"><div class="space-y-4"><!-- Sale details form --><div class="rounded-2xl border border-gray-200 dark:border-slate-800/50 bg-white dark:bg-slate-900 p-6"><div class="grid grid-cols-1 gap-4 sm:grid-cols-2"><div><label class="block text-sm font-medium uppercase tracking-wider text-slate-600 dark:text-slate-300">Transaction No</label><input type="text" readonly class="mt-1 block w-full rounded-xl px-4 py-2 bg-slate-50 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-700/50 text-sm focus:ring-2 focus-brand-600 focus:outline-none" value="T-003" /></div><div><label class="block text-sm font-medium uppercase tracking-wider text-slate-600 dark:text-slate-300">Sale Date</label><input type="date" class="mt-1 block w-full rounded-xl px-4 py-2 bg-slate-50 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-700/50 text-sm focus:ring-2 focus-brand-600 focus:outline-none" /></div><div><label class="block text-sm font-medium uppercase tracking-wider text-slate-600 dark:text-slate-300">Customer</label><select class="mt-1 block w-full rounded-xl px-4 py-2 bg-slate-50 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-700/50 text-sm focus:ring-2 focus-brand-600 focus:outline-none"><option>Choose customer...</option><option>Acme Corporation</option><option>Banco Inc</option></select></div><div><label class="block text-sm font-medium uppercase tracking-wider text-slate-600 dark:text-slate-300">Salesperson</label><select class="mt-1 block w-full rounded-xl px-4 py-2 bg-slate-50 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-700/50 text-sm focus:ring-2 focus-brand-600 focus:outline-none"><option>Choose salesperson...</option><option>Juan Dela Cruz</option><option>Maria Santos</option></select></div></div></div><!-- Buttons --><div class="mt-6 flex gap-3"><button class="flex-1 rounded-full py-2 px-4 bg-brand-600 text-white text-sm font-medium uppercase tracking-wider hover:bg-brand-500 transition-colors">Create Sale</button><button class="rounded-full py-2 px-4 border border-slate-300 dark:border-slate-700/50 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-200 transition-colors">Cancel</button></div></div></main><footer class="mt-6 text-xs text-slate-500 dark:text-slate-400"><p>PentadERP • Sales • © 2026</p></footer><script>const html=document.documentElement;const m=html.querySelector('i.fa-moon');const s=html.querySelector('i.fa-sun');function t(){html.classList.toggle('dark');m.classList.toggle('block',html.classList.contains('dark'));m.classList.toggle('hidden',!html.classList.contains('dark'));s.classList.toggle('hidden',html.classList.contains('dark'));s.classList.toggle('block',!html.classList.contains('dark'));}html.classList.add('dark');document.querySelectorAll('button[data-theme-toggle]').forEach(btn=>btn.addEventListener('click',t));</script></body></html>
