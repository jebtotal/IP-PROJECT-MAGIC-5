<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PentadERP — Rights Matrix Mockup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../shared/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-2xl">
    <div class="modal-content glass-panel bg-white dark:bg-slate-900 rounded-3xl w-full p-8 shadow-2xl relative" role="dialog" aria-modal="true" aria-labelledby="rightsTitle">
      <button type="button" aria-label="Close rights dialog" class="absolute top-6 right-6 text-gray-400 hover:text-gray-200"><i class="fa-solid fa-xmark text-lg" aria-hidden="true"></i></button>
      <h1 id="rightsTitle" class="text-2xl font-black text-gray-900 dark:text-white mb-1">Rights — Alex Rivera</h1>
      <p class="text-xs text-gray-500 dark:text-gray-400">Assign module View access and individual actions.</p>
      <div class="flex justify-end gap-2 mt-4">
        <button type="button" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-gray-100 dark:bg-slate-950 text-gray-500">All <span class="ml-1 px-1.5 py-0.5 rounded-full bg-white/70 dark:bg-slate-900 text-[9px] uppercase">Proposed</span></button>
        <button type="button" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-gray-100 dark:bg-slate-950 text-gray-500">None <span class="ml-1 px-1.5 py-0.5 rounded-full bg-white/70 dark:bg-slate-900 text-[9px] uppercase">Proposed</span></button>
      </div>

      <div class="max-h-80 overflow-y-auto space-y-4 pr-2 mt-4">
        <section class="p-4 rounded-2xl border border-gray-200 dark:border-gray-800 bg-gray-50/50 dark:bg-slate-950/50" aria-labelledby="customerRights">
          <h2 id="customerRights" class="font-bold text-xs text-gray-900 dark:text-white mb-2">Customer Management</h2>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked><span>View Customers</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked><span>Add Customer</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Edit Customer</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Delete Customer</span></label>
          </div>
        </section>

        <section class="p-4 rounded-2xl border border-gray-200 dark:border-gray-800 bg-gray-50/50 dark:bg-slate-950/50" aria-labelledby="productRights">
          <h2 id="productRights" class="font-bold text-xs text-gray-900 dark:text-white mb-2">Product Management</h2>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked><span>View Products</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Add Product</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Edit Product</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Delete Product</span></label>
          </div>
        </section>

        <section class="p-4 rounded-2xl border border-gray-200 dark:border-gray-800 bg-gray-50/50 dark:bg-slate-950/50" aria-labelledby="hrRights">
          <h2 id="hrRights" class="font-bold text-xs text-gray-900 dark:text-white mb-2">Human Resources</h2>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked><span>View HR</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Add Job</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Edit Job</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Delete Job</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Add Department</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Edit Department</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Delete Department</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Add Employee</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Edit Employee</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Delete Employee</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>View Job History <span class="ml-1 px-1.5 py-0.5 rounded-full bg-gray-100 dark:bg-slate-900 text-gray-500 text-[9px] uppercase">Proposed</span></span></label>
          </div>
        </section>

        <section class="p-4 rounded-2xl border border-gray-200 dark:border-gray-800 bg-gray-50/50 dark:bg-slate-950/50" aria-labelledby="salesRights">
          <h2 id="salesRights" class="font-bold text-xs text-gray-900 dark:text-white mb-2">Sales</h2>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked><span>View Sales</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Add Sale</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Edit Sale</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Delete Sale</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>View Sale Detail <span class="ml-1 px-1.5 py-0.5 rounded-full bg-gray-100 dark:bg-slate-900 text-gray-500 text-[9px] uppercase">Proposed</span></span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Add Sale Detail <span class="ml-1 px-1.5 py-0.5 rounded-full bg-gray-100 dark:bg-slate-900 text-gray-500 text-[9px] uppercase">Proposed</span></span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Edit Sale Detail <span class="ml-1 px-1.5 py-0.5 rounded-full bg-gray-100 dark:bg-slate-900 text-gray-500 text-[9px] uppercase">Proposed</span></span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>Delete Sale Detail <span class="ml-1 px-1.5 py-0.5 rounded-full bg-gray-100 dark:bg-slate-900 text-gray-500 text-[9px] uppercase">Proposed</span></span></label>
          </div>
        </section>

        <section class="p-4 rounded-2xl border border-gray-200 dark:border-gray-800 bg-gray-50/50 dark:bg-slate-950/50" aria-labelledby="reportRights">
          <h2 id="reportRights" class="font-bold text-xs text-gray-900 dark:text-white mb-2">Reports</h2>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked><span>View Reports</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>View Top Customers <span class="ml-1 px-1.5 py-0.5 rounded-full bg-gray-100 dark:bg-slate-900 text-gray-500 text-[9px] uppercase">Proposed</span></span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"><span>View Products Master <span class="ml-1 px-1.5 py-0.5 rounded-full bg-gray-100 dark:bg-slate-900 text-gray-500 text-[9px] uppercase">Proposed</span></span></label>
          </div>
        </section>
      </div>

      <div class="mt-5 p-3 rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50/50 dark:bg-slate-950/50 text-xs text-gray-600 dark:text-gray-300"><span class="px-2 py-0.5 rounded-full bg-gray-100 dark:bg-slate-900 text-gray-500 text-[10px] font-bold uppercase">Proposed</span> You cannot remove or demote the last Superadmin.</div>
      <div class="flex items-center gap-3 pt-6 border-t border-gray-200 dark:border-gray-800 mt-6"><button type="button" class="flex-1 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs uppercase tracking-wider shadow-lg shadow-brand-600/25">Save Matrix</button><button type="button" class="px-5 py-3 rounded-xl border border-gray-200 dark:border-gray-800 text-xs font-bold">Cancel</button></div>
    </div>
  </main>
  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }
  </script>
</body>
</html>
