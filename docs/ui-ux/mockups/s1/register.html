<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PentadERP — Create Account Mockup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../shared/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body class="min-h-screen flex flex-col">
  <header class="h-20 glass-panel bg-white/80 dark:bg-slate-900/80 px-6 flex items-center justify-between">
    <a href="#" class="flex items-center gap-3 font-black text-xl tracking-tight text-gray-900 dark:text-white">
      <span class="font-extrabold leading-none">Pentad<span class="text-brand-500">ERP</span></span>
    </a>
    <button type="button" onclick="toggleTheme()" aria-label="Toggle color theme" class="p-2.5 rounded-xl border border-gray-200 dark:border-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all">
      <i class="fa-solid fa-moon dark:hidden text-sm" aria-hidden="true"></i>
      <i class="fa-solid fa-sun hidden dark:block text-amber-400 text-sm" aria-hidden="true"></i>
    </button>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md space-y-8">
      <section class="modal-content glass-panel bg-white dark:bg-slate-900 rounded-3xl w-full p-8 shadow-2xl relative" aria-labelledby="registerTitle">
        <button type="button" aria-label="Close registration dialog" class="absolute top-6 right-6 text-gray-400 hover:text-gray-200">
          <i class="fa-solid fa-xmark text-lg" aria-hidden="true"></i>
        </button>
        <div class="mb-6">
          <h1 id="registerTitle" class="text-2xl font-black text-gray-900 dark:text-white tracking-tight">Create Account</h1>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Join the PentadERP platform.</p>
        </div>

        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="regFirstName" class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">First Name</label>
              <input type="text" id="regFirstName" name="firstName" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 dark:border-gray-800 bg-white/50 dark:bg-slate-950/50 text-gray-900 dark:text-white text-xs outline-none focus:ring-2 focus:ring-brand-500" />
            </div>
            <div>
              <label for="regLastName" class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">Last Name</label>
              <input type="text" id="regLastName" name="lastName" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 dark:border-gray-800 bg-white/50 dark:bg-slate-950/50 text-gray-900 dark:text-white text-xs outline-none focus:ring-2 focus:ring-brand-500" />
            </div>
          </div>

          <div>
            <label for="regEmail" class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">Email</label>
            <input type="email" id="regEmail" name="email" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 dark:border-gray-800 bg-white/50 dark:bg-slate-950/50 text-gray-900 dark:text-white text-xs outline-none focus:ring-2 focus:ring-brand-500" />
          </div>

          <button type="button" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs uppercase tracking-wider shadow-lg shadow-brand-600/25 transition-all">Submit Registration</button>
        </div>

        <p class="text-center text-xs text-gray-500 mt-6">
          Already registered? <a href="login.html" class="text-brand-500 font-bold hover:underline">Sign In</a>
        </p>
      </section>

      <section class="modal-content glass-panel bg-white dark:bg-slate-900 rounded-3xl w-full p-8 shadow-2xl relative" aria-labelledby="setPasswordTitle">
        <div class="flex flex-wrap items-center gap-2 mb-6">
          <h2 id="setPasswordTitle" class="text-2xl font-black text-gray-900 dark:text-white tracking-tight">Set your password</h2>
          <span class="px-2 py-0.5 rounded-full bg-gray-100 dark:bg-slate-950 text-gray-500 text-[10px] font-bold uppercase tracking-wider">Proposed</span>
        </div>
        <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">First sign-in for an approved account.</p>
        <div class="space-y-4">
          <div>
            <label for="newPassword" class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">New Password</label>
            <div class="relative">
              <input type="password" id="newPassword" required class="w-full px-4 py-2.5 pr-10 rounded-xl border border-gray-200 dark:border-gray-800 bg-white/50 dark:bg-slate-950/50 text-gray-900 dark:text-white text-xs outline-none focus:ring-2 focus:ring-brand-500" />
              <button type="button" aria-label="Show new password" class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center text-gray-400 hover:text-gray-200 outline-none focus:outline-none"><i class="fa-solid fa-eye-slash text-xs" aria-hidden="true"></i></button>
            </div>
          </div>
          <div>
            <label for="confirmPassword" class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">Confirm Password</label>
            <div class="relative">
              <input type="password" id="confirmPassword" required class="w-full px-4 py-2.5 pr-10 rounded-xl border border-gray-200 dark:border-gray-800 bg-white/50 dark:bg-slate-950/50 text-gray-900 dark:text-white text-xs outline-none focus:ring-2 focus:ring-brand-500" />
              <button type="button" aria-label="Show confirmation password" class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center text-gray-400 hover:text-gray-200 outline-none focus:outline-none"><i class="fa-solid fa-eye-slash text-xs" aria-hidden="true"></i></button>
            </div>
          </div>
          <button type="button" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs uppercase tracking-wider shadow-lg shadow-brand-600/25 transition-all">Set Password</button>
        </div>
      </section>
    </div>
  </main>
  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }
  </script>
</body>
</html>
